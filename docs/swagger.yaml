basePath: /
definitions:
  handler.personalAssetID:
    properties:
      id:
        type: integer
    type: object
  handler.personalAssetsResponse:
    properties:
      credit_cards:
        items:
          $ref: '#/definitions/model.CreditCard'
        type: array
      deposits:
        items:
          $ref: '#/definitions/model.Deposit'
        type: array
      insurances:
        items:
          $ref: '#/definitions/model.Insurance'
        type: array
    type: object
  model.AuthModel:
    properties:
      pass:
        type: string
      user:
        type: string
    type: object
  model.AuthResponse:
    properties:
      profiles:
        items:
          $ref: '#/definitions/model.Profile'
        type: array
      ref_token:
        type: string
      token:
        $ref: '#/definitions/model.Token'
    type: object
  model.Bond:
    properties:
      accrued_interest:
        allOf:
        - $ref: '#/definitions/model.Money'
        description: Per bond, in settlement currency.
      clean_price:
        allOf:
        - $ref: '#/definitions/model.Money'
        description: Per bond, excluding accrued interest.
      code:
        type: string
      group_name:
        type: string
      isin:
        type: string
      lot_amount:
        type: integer
      lot_size:
        type: integer
      maturity_date:
        description: YYYY-MM-DD.
        type: string
      maturity_payment:
        allOf:
        - $ref: '#/definitions/model.Money'
        description: Principal per bond; nil for multiple payments.
      name:
        type: string
    type: object
  model.BondCouponsResponse:
    properties:
      code:
        type: string
      coupons:
        items:
          $ref: '#/definitions/model.Coupon'
        type: array
    type: object
  model.BondGroup:
    properties:
      name:
        type: string
      weight:
        type: integer
    type: object
  model.BondOperation:
    properties:
      code:
        type: string
      group_name:
        type: string
      lot_amount:
        type: integer
      lot_size:
        type: integer
      name:
        type: string
      price:
        allOf:
        - $ref: '#/definitions/model.Money'
        description: Paid or received per bond, including accrued interest.
    type: object
  model.BondRebalanceResponse:
    properties:
      bonds:
        items:
          $ref: '#/definitions/model.Bond'
        type: array
      cost_diff:
        type: number
      total_prev_cost:
        type: number
    type: object
  model.Coupon:
    properties:
      amount:
        allOf:
        - $ref: '#/definitions/model.Money'
        description: Gross per bond; nil if unknown.
      payment_date:
        description: YYYY-MM-DD.
        type: string
    type: object
  model.CreditCard:
    properties:
      bank_name:
        type: string
      id:
        type: integer
      mandatory_payment_amount_rub:
        type: number
      mandatory_payment_date:
        type: string
      name:
        type: string
      overall_limit_rub:
        type: number
    type: object
  model.CreditCardUpdate:
    properties:
      bank_name:
        type: string
      id:
        type: integer
      mandatory_payment_amount_rub:
        type: number
      mandatory_payment_date:
        type: string
      name:
        type: string
      overall_limit_rub:
        type: number
    type: object
  model.CryptoAsset:
    properties:
      amount:
        type: number
      annual_interest:
        type: number
      group_name:
        type: string
      id:
        type: integer
      name:
        type: string
      platform:
        type: string
      url:
        type: string
    type: object
  model.CryptoAssetUpdate:
    properties:
      annual_interest:
        type: number
      id:
        type: integer
      name:
        type: string
      platform:
        type: string
      url:
        type: string
    type: object
  model.CryptoGroup:
    properties:
      name:
        type: string
      weight:
        type: integer
    type: object
  model.CryptoOperation:
    properties:
      amount:
        type: number
      annual_interest:
        type: number
      group_name:
        type: string
      id:
        type: integer
      name:
        type: string
      platform:
        type: string
      price:
        $ref: '#/definitions/model.Money'
      url:
        type: string
    type: object
  model.CurrencyRate:
    properties:
      from:
        type: string
      rate:
        type: number
      to:
        type: string
    type: object
  model.Deposit:
    properties:
      amount_rub:
        type: number
      annual_interest:
        type: number
      bank_name:
        type: string
      end_date:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.DepositClose:
    properties:
      closing_amount_rub:
        type: number
      id:
        type: integer
    type: object
  model.DepositUpdate:
    properties:
      annual_interest:
        type: number
      bank_name:
        type: string
      end_date:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.FoundBond:
    properties:
      err_msg:
        type: string
      search_results:
        items:
          $ref: '#/definitions/model.Bond'
        type: array
    type: object
  model.FoundStock:
    properties:
      err_msg:
        type: string
      search_results:
        items:
          $ref: '#/definitions/model.Stock'
        type: array
    type: object
  model.Insurance:
    properties:
      amount_rub:
        type: number
      annual_interest:
        type: number
      company_name:
        type: string
      end_date:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.InsuranceClose:
    properties:
      closing_amount_rub:
        type: number
      id:
        type: integer
    type: object
  model.InsuranceUpdate:
    properties:
      annual_interest:
        type: number
      company_name:
        type: string
      end_date:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.Money:
    properties:
      currency:
        type: string
      price:
        type: number
    type: object
  model.Profile:
    properties:
      default:
        type: boolean
      name:
        type: string
    type: object
  model.RenameBondGroupBody:
    properties:
      name_new:
        type: string
      name_old:
        type: string
    type: object
  model.RenameCryptoGroupBody:
    properties:
      name_new:
        type: string
      name_old:
        type: string
    type: object
  model.RenameStockGroupBody:
    properties:
      name_new:
        type: string
      name_old:
        type: string
    type: object
  model.Stock:
    properties:
      code:
        type: string
      group_name:
        type: string
      lot_amount:
        type: integer
      lot_size:
        type: integer
      name:
        type: string
      price:
        type: number
    type: object
  model.StockGroup:
    properties:
      name:
        type: string
      weight:
        type: integer
    type: object
  model.StockRebalanceResponse:
    properties:
      cost_diff:
        type: number
      stocks:
        items:
          $ref: '#/definitions/model.Stock'
        type: array
      total_prev_cost:
        type: number
    type: object
  model.Token:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
    type: object
info:
  contact: {}
  title: Stocks Calculator API
  version: "1.0"
paths:
  /addbondgroups:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bond groups
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/model.BondGroup'
          type: array
      responses:
        "200":
          description: OK
        "400":
          description: Request body is empty or invalid group name
          schema:
            type: string
        "404":
          description: No default profile
          schema:
            type: string
        "409":
          description: Group already exists
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add bond groups
      tags:
      - bond groups
  /addbonds:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bond purchases
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/model.BondOperation'
          type: array
      responses:
        "200":
          description: OK
        "400":
          description: Request body is empty / invalid bond name, amount or price
            / wrong bond group / duplicate bond
          schema:
            type: string
        "404":
          description: No default profile or group not found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add bonds
      tags:
      - bonds
  /addcreditcard:
    post:
      consumes:
      - application/json
      description: Date fields are strings.
      parameters:
      - description: Credit card
        in: body
        name: card
        required: true
        schema:
          $ref: '#/definitions/model.CreditCard'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add a credit card
      tags:
      - personal-assets
  /addcryptogroups:
    post:
      consumes:
      - application/json
      description: New groups are created with weight zero, regardless of the supplied
        weight. Update weights separately.
      parameters:
      - description: Groups
        in: body
        name: groups
        required: true
        schema:
          items:
            $ref: '#/definitions/model.CryptoGroup'
          type: array
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add crypto groups
      tags:
      - crypto
  /adddeposit:
    post:
      consumes:
      - application/json
      description: Date fields are strings.
      parameters:
      - description: Deposit
        in: body
        name: deposit
        required: true
        schema:
          $ref: '#/definitions/model.Deposit'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add a deposit
      tags:
      - personal-assets
  /addgroups:
    post:
      consumes:
      - application/json
      parameters:
      - description: Groups
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/model.StockGroup'
          type: array
      responses:
        "200":
          description: OK
        "400":
          description: Request body is empty
          schema:
            type: string
        "404":
          description: No default profile
          schema:
            type: string
        "409":
          description: Group already exists
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add groups
      tags:
      - groups
  /addinsurance:
    post:
      consumes:
      - application/json
      description: Date fields are strings.
      parameters:
      - description: Insurance
        in: body
        name: insurance
        required: true
        schema:
          $ref: '#/definitions/model.Insurance'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add insurance
      tags:
      - personal-assets
  /addstocks:
    post:
      consumes:
      - application/json
      parameters:
      - description: Stocks
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/model.Stock'
          type: array
      responses:
        "200":
          description: OK
        "400":
          description: Request body is empty / wrong stock group / wrong stock amount
          schema:
            type: string
        "404":
          description: Group not found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add stocks
      tags:
      - stocks
  /bondcoupons:
    get:
      description: Returns available historical and future coupon amounts per bond;
        null means unknown.
      parameters:
      - description: MOEX bond code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BondCouponsResponse'
        "400":
          description: Bond code is required
          schema:
            type: string
        "404":
          description: Bond not found
          schema:
            type: string
        "500":
          description: Internal Server Error
        "504":
          description: Coupon lookup timed out
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get bond coupon schedule
      tags:
      - bonds
  /buycrypto:
    post:
      consumes:
      - application/json
      parameters:
      - description: Operations
        in: body
        name: operations
        required: true
        schema:
          items:
            $ref: '#/definitions/model.CryptoOperation'
          type: array
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Buy crypto
      tags:
      - crypto
  /closedeposit:
    post:
      consumes:
      - application/json
      description: Date fields are strings.
      parameters:
      - description: Deposit close
        in: body
        name: deposit
        required: true
        schema:
          $ref: '#/definitions/model.DepositClose'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Close a deposit
      tags:
      - personal-assets
  /closeinsurance:
    post:
      consumes:
      - application/json
      description: Date fields are strings.
      parameters:
      - description: Insurance close
        in: body
        name: insurance
        required: true
        schema:
          $ref: '#/definitions/model.InsuranceClose'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Close insurance
      tags:
      - personal-assets
  /createprofile:
    post:
      consumes:
      - application/json
      parameters:
      - description: Profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.Profile'
      responses:
        "200":
          description: OK
        "400":
          description: Missing profile name
          schema:
            type: string
        "409":
          description: Profile already exists
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create profile
      tags:
      - profiles
  /createuser:
    post:
      consumes:
      - application/json
      description: Create user with username and password
      parameters:
      - description: Create user credentials
        in: body
        name: authmodel
        required: true
        schema:
          $ref: '#/definitions/model.AuthModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "400":
          description: incorrect request body format
          schema:
            type: string
        "409":
          description: user exists
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: CreateUser
      tags:
      - auth
  /currencyrate:
    get:
      description: |-
        One unit of from equals rate units of to. Supports RUB, USD, EUR and CNY.
        USD and EUR use CBR reference values published by MOEX; CNY uses the previous MOEX weighted-average rate.
      parameters:
      - description: Source currency
        in: query
        name: from
        required: true
        type: string
      - description: Target currency
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CurrencyRate'
        "400":
          description: Missing or unsupported currency
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get currency conversion reference rate
      tags:
      - currency
  /findbonds:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bond names
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.FoundBond'
            type: array
        "400":
          description: Request body is empty
          schema:
            type: string
        "404":
          description: No default profile
          schema:
            type: string
        "500":
          description: Internal Server Error
        "504":
          description: Bond search timed out
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Find bonds
      tags:
      - bonds
  /findstocks:
    post:
      consumes:
      - application/json
      parameters:
      - description: Stock names
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.FoundStock'
            type: array
        "400":
          description: Request body is empty
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Find stocks
      tags:
      - stocks
  /getbondgroups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.BondGroup'
            type: array
        "404":
          description: No default profile
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get bond groups
      tags:
      - bond groups
  /getbonds:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Bond'
            type: array
        "404":
          description: No default profile
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get bonds
      tags:
      - bonds
  /getcryptoassets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.CryptoAsset'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List crypto assets
      tags:
      - crypto
  /getcryptogroups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.CryptoGroup'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List crypto groups
      tags:
      - crypto
  /getgroups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.StockGroup'
            type: array
        "404":
          description: No default profile
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get groups
      tags:
      - groups
  /getpersonalassets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.personalAssetsResponse'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List personal assets
      tags:
      - personal-assets
  /getprofiles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Profile'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get profiles
      tags:
      - profiles
  /getstocks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Stock'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get stocks
      tags:
      - stocks
  /login:
    post:
      consumes:
      - application/json
      description: Log in with username and password
      parameters:
      - description: Login credentials
        in: body
        name: authmodel
        required: true
        schema:
          $ref: '#/definitions/model.AuthModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "400":
          description: incorrect request body format
          schema:
            type: string
        "401":
          description: wrong credentials
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Login
      tags:
      - auth
  /rebalance:
    get:
      parameters:
      - description: If true, rebalance by buying only without selling
        in: query
        name: nosell
        required: true
        type: boolean
      - description: Value difference to rebalance with (required if nosell is true,
          must be > 0)
        in: query
        name: valdiff
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.StockRebalanceResponse'
        "400":
          description: Missing or invalid params
          schema:
            type: string
        "428":
          description: Stocks/groups not found or groups not weighted
          schema:
            type: string
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Rebalance portfolio
      tags:
      - rebalance
  /rebalancebonds:
    get:
      parameters:
      - description: If true, rebalance by buying only without selling
        in: query
        name: nosell
        required: true
        type: boolean
      - description: Desired value difference; must be positive if nosell is true
        in: query
        name: valdiff
        required: true
        type: number
      produces:
      - application/json
      responses:
