services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env or your environment}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env or your environment}
      POSTGRES_DB: stocks_calculator
    volumes:
      - dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d stocks_calculator"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: migrate/migrate:latest
    command:
      - -path
      - /migrations
      - -database
      - postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/stocks_calculator?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      args:
        BUILD_TAGS: debug
    environment:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: "8989"
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8989}:8989"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://server:8989
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0 --strictPort"]
    ports:
      - "${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  dev_pgdata:
  frontend_node_modules:
