services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in release.env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in release.env}
      POSTGRES_DB: stocks_calculator
    volumes:
      - release_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d stocks_calculator"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: migrate/migrate:latest
    command:
      - -path
      - /migrations
      - -database
      - postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/stocks_calculator?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile.release
    restart: unless-stopped
    environment:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: "8989"
    volumes:
      - ./release.config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELEASE_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_started
        restart: true
      frontend:
        condition: service_started
        restart: true

volumes:
  release_pgdata:
